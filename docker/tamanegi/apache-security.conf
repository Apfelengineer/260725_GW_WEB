ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<FilesMatch "^(availability-contract|runtime-config)\.php$">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
