<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KPTC Schedulerとの社内システム連携を確認する模擬ポータルです。" />
    <title>社内ポータル | KPTC</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="portal-shell">
      <header class="portal-header">
        <a class="brand" href="./" aria-label="社内ポータル ホーム">
          <span class="brand-mark" aria-hidden="true">R</span>
          <span><b>社内ポータル</b><small>業務システム入口</small></span>
        </a>
        <span class="environment-badge">連携確認用</span>
      </header>

      <section class="portal-card" aria-labelledby="portal-title">
        <div class="intro">
          <p class="eyebrow">SCHEDULE &amp; LAB AVAILABILITY</p>
          <h1 id="portal-title">予定表・試験室空き状況</h1>
          <p>ユーザーIDを設定すると、専用リンクからスケジューラーを開けます。</p>
        </div>

        <section class="portal-section" aria-labelledby="user-id-title">
          <div class="section-heading">
            <span class="step-number" aria-hidden="true">1</span>
            <div><h2 id="user-id-title">ユーザーID</h2><p>入力したIDは、毎回異なる暗号文でスケジューラーへ渡します。</p></div>
          </div>
          <form id="user-id-form" novalidate>
            <label for="user-id">3桁のユーザーID</label>
            <div class="input-row">
              <input
                id="user-id"
                name="userId"
                type="text"
                inputmode="numeric"
                autocomplete="username"
                pattern="[0-9]{3}"
                maxlength="3"
                placeholder="例：123"
                aria-describedby="user-id-help user-id-error"
                required
              />
              <button type="submit">ユーザーIDを設定</button>
            </div>
            <p id="user-id-help" class="field-help">半角数字3桁で入力してください。</p>
            <p id="user-id-error" class="field-error" role="alert" aria-live="polite"></p>
            <p id="user-id-status" class="field-status" role="status" aria-live="polite"></p>
          </form>
        </section>

        <section class="portal-section link-section" aria-labelledby="system-links-title">
          <div class="section-heading">
            <span class="step-number" aria-hidden="true">2</span>
            <div><h2 id="system-links-title">システムを開く</h2><p>利用するページを選択します。</p></div>
          </div>

          <div class="system-links">
            <a id="scheduler-link" class="system-link is-disabled" href="#" aria-disabled="true">
              <span><b>スケジューラーを開く</b><small>先に3桁のユーザーIDを設定してください</small></span>
              <span aria-hidden="true">→</span>
            </a>
            <a id="calendar-link" class="system-link" href="#" target="_blank" rel="noopener noreferrer">
              <span><b>試験室の空き状況を見る</b><small>公開カレンダーを新しいタブで開きます</small></span>
              <span aria-hidden="true">→</span>
            </a>
          </div>
        </section>
      </section>

      <footer>
        <p>このページは社内システム連携を確認するための模擬サイトです。</p>
      </footer>
    </main>
  </body>
</html>
