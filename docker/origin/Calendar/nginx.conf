worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-store" always;
        location = /healthz { return 200 "ok\n"; }
        # 公開してよいJSONの固定パスだけを公開します。SQLite・設定・状態ファイルはマウントしません。
        location = /data/public-availability.json {
            alias /var/lib/kptc-public/public-availability.json;
            limit_except GET { deny all; }
        }
        location /data/ { return 404; }
        location ~ \.php(?:/|$) { return 404; }
        location ~ /\. { return 404; }
        location / {
            limit_except GET { deny all; }
            try_files $uri $uri/ =404;
        }
    }
}
