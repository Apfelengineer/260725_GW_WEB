ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<FilesMatch "^(auth|availability-contract|availability-json|availability-publisher|availability-room-config|backup-scheduler-cli|manage-auth-user-cli|monitor-availability-cli|portal-access|publish-availability-cli|restore-scheduler-cli|runtime-config|scheduler-backup)\.php$">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"
